name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The hook and several checks are shell; shellcheck is the one tool the
      # local runs usually lack, so CI is where it actually gets enforced.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Same script contributors run locally — CI must not drift from it.
      - name: Validate repository
        run: bash tools/validate-repo.sh

      # The scripts ship to users and run on their machines, so a broken
      # argument path is a defect even though there is no device in CI.
      - name: Smoke-test the shipped scripts
        run: |
          set -euo pipefail
          S=skills/android-app-development/scripts

          # Each must fail cleanly on bad input rather than hanging or crashing.
          bash "$S/verify-artifact.sh" /nonexistent.apk && exit 1 || true
          bash "$S/verify-install.sh" && exit 1 || true

          # preflight must survive a directory that is not an Android project, and
          # must report it. Exit 1 is the correct answer there — it is a check, so a
          # bare toolchain is a finding, not a pass. Assert it ran to completion
          # rather than dying midway, and that it did not exit 0 on a machine with
          # nothing installed.
          tmp=$(mktemp -d)
          set +e
          out="$(bash "$S/preflight.sh" "$tmp" 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$out" | grep -q 'preflight clean\|review the warnings above' \
            || { printf '%s\n' "$out"; echo "preflight did not reach its summary"; exit 1; }
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] \
            || { echo "preflight exited $rc on a non-project directory"; exit 1; }

          # And it must actually fail on a bare machine, or every && chain and CI
          # step downstream reads a broken toolchain as success.
          [ "$rc" -eq 1 ] || { echo "preflight exited 0 with warnings — it cannot fail"; exit 1; }
          echo "shipped scripts handle bad input without hanging or crashing"
